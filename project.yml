name: Tabby
options:
  bundleIdPrefix: com.sarkarshubhdeep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Tabby:
    type: application
    platform: iOS
    sources: [Tabby]
    info:
      path: Tabby/Info.plist
      properties:
        CFBundleDisplayName: Tabby
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Tabby uses the camera to scan your bill.
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarkarshubhdeep.tabby
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  TabbyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TabbyTests]
    dependencies:
      - target: Tabby
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sarkarshubhdeep.tabby.tests
schemes:
  Tabby:
    build:
      targets:
        Tabby: all
    test:
      targets: [TabbyTests]
